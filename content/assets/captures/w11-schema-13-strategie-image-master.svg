<svg xmlns="http://www.w3.org/2000/svg" width="640" height="493" viewBox="0 0 640 493" role="img" aria-labelledby="title desc">
  <title id="title">De l’ISO au poste déployé</title>
  <desc id="desc">Le chapitre 13 prépare les outils et le fichier de réponse, le 14 prépare MASTER, le 15 capture le WIM et le 16 déploie PC02.</desc>
  <rect x="1" y="1" width="638" height="491" rx="20" fill="#f1f5fa" stroke="#a9bad0"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M21 2H619Q638 2 638 21V72H2V21Q2 2 21 2Z" fill="#14243d"/>
<path d="M4 8h16m-4-4 4 4-4 4 M14 17h16m-4-4 4 4-4 4 M4 26h16m-4-4 4 4-4 4" transform="translate(24 20)" fill="none" stroke="#7ed5ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="46" fill="#ffffff" font-size="26" font-weight="700">De l’ISO au poste déployé</text>
    <rect x="17" y="87" width="606" height="63" rx="10" fill="#ffffff" stroke="#a6c9ed"/>
    <rect x="31" y="96" width="25" height="25" rx="8" fill="#e2efff" stroke="none"/>
    <text x="43.5" y="114" fill="#143c6f" font-size="15" font-weight="700" text-anchor="middle">1</text>
    <text x="65" y="114" fill="#143c6f" font-size="21" font-weight="700">Chap. 13 · Outils et réponse</text>
    <text x="65" y="135" fill="#253b54" font-size="18">install.wim, ADK, Windows SIM et autounattend.xml.</text>
    <path d="M320.0 151L320.0 165" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320.0,165 316.0,159 324.0,159" fill="#6e85a0"/>
    <rect x="17" y="167" width="606" height="84" rx="10" fill="#ffffff" stroke="#9ccac8"/>
    <rect x="31" y="176" width="25" height="25" rx="8" fill="#ddf4f0" stroke="none"/>
    <text x="43.5" y="194" fill="#104c49" font-size="15" font-weight="700" text-anchor="middle">2</text>
    <text x="65" y="194" fill="#104c49" font-size="21" font-weight="700">Chap. 14 · VM MASTER</text>
    <text x="65" y="215" fill="#253b54" font-size="18">Mode audit, checkpoint « Avant-Sysprep », puis sysprep</text>
    <text x="65" y="236" fill="#253b54" font-size="18">/generalize.</text>
    <path d="M320.0 252L320.0 266" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320.0,266 316.0,260 324.0,260" fill="#6e85a0"/>
    <rect x="17" y="268" width="606" height="63" rx="10" fill="#ffffff" stroke="#c1afe8"/>
    <rect x="31" y="277" width="25" height="25" rx="8" fill="#f2ecff" stroke="none"/>
    <text x="43.5" y="295" fill="#4d2b79" font-size="15" font-weight="700" text-anchor="middle">3</text>
    <text x="65" y="295" fill="#4d2b79" font-size="21" font-weight="700">Chap. 15 · Capture WIM</text>
    <text x="65" y="316" fill="#253b54" font-size="18">Capture avec DISM depuis l’hôte.</text>
    <path d="M320.0 332L320.0 346" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320.0,346 316.0,340 324.0,340" fill="#6e85a0"/>
    <rect x="17" y="348" width="606" height="84" rx="10" fill="#ffffff" stroke="#dac08d"/>
    <rect x="31" y="357" width="25" height="25" rx="8" fill="#fff1d7" stroke="none"/>
    <text x="43.5" y="375" fill="#63400e" font-size="15" font-weight="700" text-anchor="middle">4</text>
    <text x="65" y="375" fill="#63400e" font-size="21" font-weight="700">Chap. 16 · ISO personnalisée</text>
    <text x="65" y="396" fill="#253b54" font-size="18">PC02 démarre sur l’ISO et atteint le Bureau sans clic grâce à</text>
    <text x="65" y="417" fill="#253b54" font-size="18">autounattend.xml.</text>
    <rect x="17" y="445" width="606" height="32" rx="8" fill="#e8eef7" stroke="#b7c6da"/>
    <text x="320.0" y="467" fill="#3e5470" font-size="16" font-weight="700" text-anchor="middle">PC01 reste joint au domaine pendant tout le parcours.</text>
  </g>
