    <path d="M474.0 237L474.0 259" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="474.0,259 470.0,253 478.0,253" fill="#6e85a0"/>
