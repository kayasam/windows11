    <text x="29" y="218" fill="#253b54" font-size="16">Utilisé par défaut</text>
    <rect x="325" y="176" width="298" height="61" rx="10" fill="#ffffff" stroke="#c1afe8"/>
    <text x="337" y="199" fill="#4d2b79" font-size="17" font-weight="700">Jeton administrateur complet</text>
    <text x="337" y="218" fill="#253b54" font-size="16">Activé uniquement sur demande</text>
    <path d="M320 150L320 163" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M166.0 163L474.0 163" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
