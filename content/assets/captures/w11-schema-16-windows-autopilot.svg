<svg xmlns="http://www.w3.org/2000/svg" width="640" height="469" viewBox="0 0 640 469" role="img" aria-labelledby="title desc">
  <title id="title">Provisionnement avec Windows Autopilot</title>
  <desc id="desc">Le fabricant enregistre l’appareil, le cloud lui attribue un profil, puis l’OOBE inscrit le poste dans Entra ID et Intune.</desc>
  <rect x="1" y="1" width="638" height="467" rx="20" fill="#f1f5fa" stroke="#a9bad0"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M21 2H619Q638 2 638 21V72H2V21Q2 2 21 2Z" fill="#14243d"/>
<path d="M4 8h16m-4-4 4 4-4 4 M14 17h16m-4-4 4 4-4 4 M4 26h16m-4-4 4 4-4 4" transform="translate(24 20)" fill="none" stroke="#7ed5ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="46" fill="#ffffff" font-size="26" font-weight="700">Provisionnement avec Windows Autopilot</text>
    <rect x="17" y="87" width="606" height="63" rx="10" fill="#ffffff" stroke="#a6c9ed"/>
    <rect x="31" y="96" width="25" height="25" rx="8" fill="#e2efff" stroke="none"/>
    <text x="43.5" y="114" fill="#143c6f" font-size="15" font-weight="700" text-anchor="middle">1</text>
    <text x="65" y="114" fill="#143c6f" font-size="21" font-weight="700">Constructeur ou revendeur</text>
    <text x="65" y="135" fill="#253b54" font-size="18">Enregistre le hash matériel. Un profil Autopilot est attribué au poste.</text>
    <path d="M320.0 151L320.0 165" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320.0,165 316.0,159 324.0,159" fill="#6e85a0"/>
    <rect x="17" y="167" width="606" height="84" rx="10" fill="#ffffff" stroke="#9ccac8"/>
    <rect x="31" y="176" width="25" height="25" rx="8" fill="#ddf4f0" stroke="none"/>
    <text x="43.5" y="194" fill="#104c49" font-size="15" font-weight="700" text-anchor="middle">2</text>
    <text x="65" y="194" fill="#104c49" font-size="21" font-weight="700">Utilisateur · Première connexion</text>
    <text x="65" y="215" fill="#253b54" font-size="18">Déballe le PC et se connecte au Wi-Fi. Le poste s’identifie auprès</text>
    <text x="65" y="236" fill="#253b54" font-size="18">du service.</text>
    <path d="M320.0 252L320.0 266" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320.0,266 316.0,260 324.0,260" fill="#6e85a0"/>
    <rect x="17" y="268" width="606" height="84" rx="10" fill="#ffffff" stroke="#c1afe8"/>
    <rect x="31" y="277" width="25" height="25" rx="8" fill="#f2ecff" stroke="none"/>
    <text x="43.5" y="295" fill="#4d2b79" font-size="15" font-weight="700" text-anchor="middle">3</text>
    <text x="65" y="295" fill="#4d2b79" font-size="21" font-weight="700">Microsoft Entra ID et Intune</text>
    <text x="65" y="316" fill="#253b54" font-size="18">OOBE personnalisée (logo et choix prédéfinis), jonction Entra ID et</text>
    <text x="65" y="337" fill="#253b54" font-size="18">inscription Intune.</text>
    <path d="M320.0 353L320.0 367" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320.0,367 316.0,361 324.0,361" fill="#6e85a0"/>
    <rect x="17" y="369" width="606" height="84" rx="10" fill="#ffffff" stroke="#dac08d"/>
    <rect x="31" y="378" width="25" height="25" rx="8" fill="#fff1d7" stroke="none"/>
    <text x="43.5" y="396" fill="#63400e" font-size="15" font-weight="700" text-anchor="middle">4</text>
    <text x="65" y="396" fill="#63400e" font-size="21" font-weight="700">Poste prêt</text>
    <text x="65" y="417" fill="#253b54" font-size="18">Applications, stratégies, BitLocker et mises à jour (Autopatch).</text>
    <text x="65" y="438" fill="#253b54" font-size="18">L’utilisateur retrouve ses données OneDrive.</text>
  </g>
</svg>
