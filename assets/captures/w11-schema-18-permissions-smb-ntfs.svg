<svg xmlns="http://www.w3.org/2000/svg" width="640" height="385" viewBox="0 0 640 385" role="img" aria-labelledby="title desc">
  <title id="title">Accès réseau et permissions NTFS</title>
  <desc id="desc">Pour ouvrir un fichier via SMB, l’accès doit être autorisé par le partage et par NTFS. La combinaison la plus restrictive s’applique.</desc>
  <rect x="1" y="1" width="638" height="383" rx="20" fill="#f1f5fa" stroke="#a9bad0"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M21 2H619Q638 2 638 21V72H2V21Q2 2 21 2Z" fill="#14243d"/>
<path d="M17 3l11 4v8c0 6-4 11-11 15C10 26 6 21 6 15V7z M12 16l3 3 7-7" transform="translate(24 20)" fill="none" stroke="#7ed5ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="46" fill="#ffffff" font-size="26" font-weight="700">Accès réseau et permissions NTFS</text>
    <rect x="17" y="87" width="606" height="63" rx="10" fill="#e2efff" stroke="#a6c9ed"/>
    <text x="320.0" y="114" fill="#143c6f" font-size="21" font-weight="700" text-anchor="middle">Accès de l’utilisateur</text>
    <text x="320.0" y="135" fill="#253b54" font-size="18" text-anchor="middle">Via \\SRV01\Commun</text>
    <rect x="17" y="176" width="298" height="90" rx="10" fill="#ffffff" stroke="#a6c9ed"/>
    <text x="29" y="199" fill="#143c6f" font-size="17" font-weight="700">Permissions de partage</text>
    <text x="29" y="218" fill="#253b54" font-size="16">\\SRV01\Commun</text>
    <text x="29" y="237" fill="#253b54" font-size="16">Contrôle d’accès au partage SMB.</text>
    <rect x="325" y="176" width="298" height="90" rx="10" fill="#ffffff" stroke="#c1afe8"/>
    <text x="337" y="199" fill="#4d2b79" font-size="17" font-weight="700">Permissions NTFS</text>
    <text x="337" y="218" fill="#253b54" font-size="16">C:\Partages\Commun</text>
    <text x="337" y="237" fill="#253b54" font-size="16">Contrôle d’accès aux fichiers.</text>
    <path d="M320 150L320 163" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M166.0 163L474.0 163" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M166.0 163L166.0 176" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="166.0,176 162.0,170 170.0,170" fill="#6e85a0"/>
    <path d="M474.0 163L474.0 176" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="474.0,176 470.0,170 478.0,170" fill="#6e85a0"/>
    <path d="M166.0 266V281H474.0V266" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M320 281L320 305" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320,305 316,299 324,299" fill="#6e85a0"/>
    <rect x="17" y="306" width="606" height="63" rx="10" fill="#ddf4f0" stroke="#9ccac8"/>
    <text x="320.0" y="333" fill="#104c49" font-size="21" font-weight="700" text-anchor="middle">Droits effectifs</text>
    <text x="320.0" y="354" fill="#253b54" font-size="18" text-anchor="middle">Les deux contrôles s’appliquent. Le plus restrictif l’emporte.</text>
  </g>
</svg>
