<svg xmlns="http://www.w3.org/2000/svg" width="640" height="378" viewBox="0 0 640 378" role="img" aria-labelledby="title desc">
  <title id="title">Une session d’Assistance rapide</title>
  <desc id="desc">L’assistant génère un code à six chiffres. La personne aidée le saisit pour ouvrir une session via le relais Microsoft.</desc>
  <rect x="1" y="1" width="638" height="376" rx="20" fill="#f1f5fa" stroke="#a9bad0"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M21 2H619Q638 2 638 21V72H2V21Q2 2 21 2Z" fill="#14243d"/>
