<svg xmlns="http://www.w3.org/2000/svg" width="640" height="326" viewBox="0 0 640 326" role="img" aria-labelledby="title desc">
  <title id="title">Migration des profils avec USMT</title>
  <desc id="desc">scanstate.exe capture le profil dans USMT.MIG sur un partage réseau, puis loadstate.exe le restaure sur le nouveau poste.</desc>
  <rect x="1" y="1" width="638" height="324" rx="20" fill="#f1f5fa" stroke="#a9bad0"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M21 2H619Q638 2 638 21V72H2V21Q2 2 21 2Z" fill="#14243d"/>
<path d="M4 8h16m-4-4 4 4-4 4 M14 17h16m-4-4 4 4-4 4 M4 26h16m-4-4 4 4-4 4" transform="translate(24 20)" fill="none" stroke="#7ed5ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="46" fill="#ffffff" font-size="26" font-weight="700">Migration des profils avec USMT</text>
    <rect x="17" y="87" width="606" height="63" rx="10" fill="#ffffff" stroke="#a6c9ed"/>
    <rect x="31" y="96" width="25" height="25" rx="8" fill="#e2efff" stroke="none"/>
    <text x="43.5" y="114" fill="#143c6f" font-size="15" font-weight="700" text-anchor="middle">1</text>
    <text x="65" y="114" fill="#143c6f" font-size="21" font-weight="700">Ancien poste · scanstate.exe</text>
    <text x="65" y="135" fill="#253b54" font-size="18">Capturer les profils et créer le fichier compressé USMT.MIG.</text>
    <path d="M320.0 151L320.0 165" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320.0,165 316.0,159 324.0,159" fill="#6e85a0"/>
    <rect x="17" y="167" width="606" height="63" rx="10" fill="#ffffff" stroke="#c1afe8"/>
    <rect x="31" y="176" width="25" height="25" rx="8" fill="#f2ecff" stroke="none"/>
    <text x="43.5" y="194" fill="#4d2b79" font-size="15" font-weight="700" text-anchor="middle">2</text>
    <text x="65" y="194" fill="#4d2b79" font-size="21" font-weight="700">Magasin · Partage réseau</text>
    <text x="65" y="215" fill="#253b54" font-size="18">\\SRV01\USMT$\Store\PC01</text>
    <path d="M320.0 231L320.0 245" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320.0,245 316.0,239 324.0,239" fill="#6e85a0"/>
    <rect x="17" y="247" width="606" height="63" rx="10" fill="#ffffff" stroke="#9ccac8"/>
    <rect x="31" y="256" width="25" height="25" rx="8" fill="#ddf4f0" stroke="none"/>
    <text x="43.5" y="274" fill="#104c49" font-size="15" font-weight="700" text-anchor="middle">3</text>
    <text x="65" y="274" fill="#104c49" font-size="21" font-weight="700">Nouveau poste · loadstate.exe</text>
    <text x="65" y="295" fill="#253b54" font-size="18">Restaurer les profils et les données.</text>
  </g>
</svg>
