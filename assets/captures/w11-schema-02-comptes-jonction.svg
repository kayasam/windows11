<svg xmlns="http://www.w3.org/2000/svg" width="640" height="382" viewBox="0 0 640 382" role="img" aria-labelledby="title desc">
  <title id="title">Comptes et jonction du poste</title>
  <desc id="desc">Les comptes associés au groupe de travail, au domaine AD, à Entra ID et à la jonction hybride.</desc>
  <rect x="1" y="1" width="638" height="380" rx="20" fill="#f1f5fa" stroke="#a9bad0"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M21 2H619Q638 2 638 21V72H2V21Q2 2 21 2Z" fill="#14243d"/>
<path d="M3 5h28v24H3z M3 11h28 M9 8h1 M13 8h1 M17 8h1" transform="translate(24 20)" fill="none" stroke="#7ed5ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="46" fill="#ffffff" font-size="26" font-weight="700">Comptes et jonction du poste</text>
    <rect x="17" y="87" width="606" height="63" rx="10" fill="#ffffff" stroke="#b7c6da"/>
    <text x="32" y="114" fill="#3e5470" font-size="21" font-weight="700">Groupe de travail</text>
    <text x="32" y="135" fill="#253b54" font-size="18">Comptes locaux, avec éventuellement un compte Microsoft (MSA).</text>
    <rect x="17" y="159" width="606" height="63" rx="10" fill="#ffffff" stroke="#a6c9ed"/>
    <text x="32" y="186" fill="#143c6f" font-size="21" font-weight="700">Joint à AD</text>
    <text x="32" y="207" fill="#253b54" font-size="18">Comptes du domaine · chap. 10.</text>
    <rect x="17" y="231" width="606" height="63" rx="10" fill="#ffffff" stroke="#9ccac8"/>
    <text x="32" y="258" fill="#104c49" font-size="21" font-weight="700">Joint à Entra ID</text>
    <text x="32" y="279" fill="#253b54" font-size="18">Comptes professionnels, gestion par Intune · chap. 16.</text>
    <rect x="17" y="303" width="606" height="63" rx="10" fill="#ffffff" stroke="#c1afe8"/>
    <text x="32" y="330" fill="#4d2b79" font-size="21" font-weight="700">Joint hybride</text>
    <text x="32" y="351" fill="#253b54" font-size="18">AD et Entra ID ensemble, synchronisés avec Entra Connect.</text>
