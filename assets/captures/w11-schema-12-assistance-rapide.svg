    <text x="320.0" y="267" fill="#104c49" font-size="16" font-weight="700" text-anchor="middle">A transmet le code à B</text>
    <path d="M320 277L320 298" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
