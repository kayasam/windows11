<svg xmlns="http://www.w3.org/2000/svg" width="640" height="382" viewBox="0 0 640 382" role="img" aria-labelledby="title desc">
  <title id="title">Ciblage d’une GPO</title>
  <desc id="desc">La liaison définit le périmètre, le filtrage de sécurité règle le droit Appliquer, WMI sélectionne des postes et le ciblage par élément affine les préférences.</desc>
  <rect x="1" y="1" width="638" height="380" rx="20" fill="#f1f5fa" stroke="#a9bad0"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M21 2H619Q638 2 638 21V72H2V21Q2 2 21 2Z" fill="#14243d"/>
<path d="M5 8h24m-24 9h24m-24 9h24 M12 5v6m11 3v6m-7 3v6" transform="translate(24 20)" fill="none" stroke="#7ed5ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="46" fill="#ffffff" font-size="26" font-weight="700">Ciblage d’une GPO</text>
    <rect x="17" y="87" width="606" height="63" rx="10" fill="#ffffff" stroke="#a6c9ed"/>
    <text x="32" y="114" fill="#143c6f" font-size="21" font-weight="700">Liaison à une UO</text>
    <text x="32" y="135" fill="#253b54" font-size="18">Quels objets entrent dans le périmètre ?</text>
    <rect x="17" y="159" width="606" height="63" rx="10" fill="#ffffff" stroke="#9ccac8"/>
    <text x="32" y="186" fill="#104c49" font-size="21" font-weight="700">Filtrage de sécurité</text>
    <text x="32" y="207" fill="#253b54" font-size="18">Qui a le droit « Appliquer » parmi ces objets ?</text>
    <rect x="17" y="231" width="606" height="63" rx="10" fill="#ffffff" stroke="#c1afe8"/>
    <text x="32" y="258" fill="#4d2b79" font-size="21" font-weight="700">Filtre WMI · Facultatif</text>
    <text x="32" y="279" fill="#253b54" font-size="18">Sur quels postes ? Exemple : uniquement Windows 11.</text>
    <rect x="17" y="303" width="606" height="63" rx="10" fill="#ffffff" stroke="#dac08d"/>
    <text x="32" y="330" fill="#63400e" font-size="21" font-weight="700">Ciblage par élément</text>
    <text x="32" y="351" fill="#253b54" font-size="18">Pour chaque préférence, selon le groupe, l’adresse IP ou l’OS.</text>
  </g>
</svg>
