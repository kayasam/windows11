<text x="72" y="46" fill="#ffffff" font-size="26" font-weight="700">UAC et les deux jetons</text>
    <rect x="17" y="87" width="606" height="63" rx="10" fill="#e2efff" stroke="#a6c9ed"/>
    <text x="320.0" y="114" fill="#143c6f" font-size="21" font-weight="700" text-anchor="middle">Ouverture de session</text>
    <text x="320.0" y="135" fill="#253b54" font-size="18" text-anchor="middle">Compte administrateur</text>
