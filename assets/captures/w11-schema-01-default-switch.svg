<svg xmlns="http://www.w3.org/2000/svg" width="640" height="382" viewBox="0 0 640 382" role="img" aria-labelledby="title desc">
  <title id="title">Default Switch</title>
  <desc id="desc">Le commutateur interne automatique de Hyper-V fournit DHCP et NAT. Windows peut changer son sous-réseau au redémarrage.</desc>
  <rect x="1" y="1" width="638" height="380" rx="20" fill="#f1f5fa" stroke="#a9bad0"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M21 2H619Q638 2 638 21V72H2V21Q2 2 21 2Z" fill="#14243d"/>
<path d="M11 6h12v7H11z M2 23h10v7H2z M22 23h10v7H22z M17 13v5M7 23v-5h20v5" transform="translate(24 20)" fill="none" stroke="#7ed5ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="46" fill="#ffffff" font-size="26" font-weight="700">Default Switch</text>
    <rect x="17" y="87" width="606" height="63" rx="10" fill="#ffffff" stroke="#a6c9ed"/>
    <text x="32" y="114" fill="#143c6f" font-size="21" font-weight="700">Type</text>
    <text x="32" y="135" fill="#253b54" font-size="18">Commutateur interne géré automatiquement par Windows.</text>
    <rect x="17" y="159" width="606" height="63" rx="10" fill="#ffffff" stroke="#9ccac8"/>
    <text x="32" y="186" fill="#104c49" font-size="21" font-weight="700">DHCP</text>
    <text x="32" y="207" fill="#253b54" font-size="18">Attribue une adresse IP aux VM.</text>
    <rect x="17" y="231" width="606" height="63" rx="10" fill="#ffffff" stroke="#9ccac8"/>
    <text x="32" y="258" fill="#104c49" font-size="21" font-weight="700">NAT</text>
    <text x="32" y="279" fill="#253b54" font-size="18">Donne aux VM un accès Internet.</text>
    <rect x="17" y="303" width="606" height="63" rx="10" fill="#ffffff" stroke="#c1afe8"/>
    <text x="32" y="330" fill="#4d2b79" font-size="21" font-weight="700">Plage IP</text>
    <text x="32" y="351" fill="#253b54" font-size="18">Windows choisit le sous-réseau, qui change au redémarrage de l’hôte.</text>
  </g>
</svg>
