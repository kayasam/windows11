<svg xmlns="http://www.w3.org/2000/svg" width="640" height="357" viewBox="0 0 640 357" role="img" aria-labelledby="title desc">
  <title id="title">UAC et les deux jetons</title>
  <desc id="desc">Une session administrateur utilise le jeton standard par défaut. L’élévation UAC active le jeton administrateur pour l’action demandée.</desc>
  <rect x="1" y="1" width="638" height="355" rx="20" fill="#f1f5fa" stroke="#a9bad0"/>
  <g font-family="Segoe UI, Arial, sans-serif">
