<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="title desc">
  <title id="title">Architecture de Windows 11</title>
  <desc id="desc">Le mode utilisateur et le mode noyau sont séparés par une frontière de privilèges. La sécurité basée sur la virtualisation est facultative. Le démarrage sécurisé repose sur l’UEFI et Secure Boot, aux côtés du TPM 2.0.</desc>

  <rect x="1" y="1" width="638" height="448" rx="21" fill="#f1f5fa" stroke="#a9bad0" stroke-width="2"/>
  <path d="M21 2H619Q638 2 638 21V74H2V21Q2 2 21 2Z" fill="#14243d"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g fill="#7ed5ff">
      <rect x="25" y="25" width="12" height="12" rx="1"/>
      <rect x="40" y="25" width="12" height="12" rx="1"/>
      <rect x="25" y="40" width="12" height="12" rx="1"/>
      <rect x="40" y="40" width="12" height="12" rx="1"/>
    </g>
    <text x="70" y="47" fill="#ffffff" font-size="27" font-weight="700">Architecture de Windows 11</text>

    <g>
      <rect x="17" y="89" width="606" height="77" rx="12" fill="#ffffff" stroke="#a6c9ed"/>
      <rect x="28" y="106" width="43" height="43" rx="10" fill="#e2efff"/>
      <g fill="none" stroke="#1658a3" stroke-width="2" stroke-linecap="round">
        <rect x="38" y="117" width="23" height="17" rx="2"/>
        <path d="M38 123h23m-18 15h13m-7-4v4"/>
      </g>
      <text x="85" y="115" fill="#143c6f" font-size="22" font-weight="700">Mode utilisateur</text>
      <text x="85" y="137" fill="#253b54" font-size="18">Applications, explorer.exe, services (svchost)</text>
      <text x="85" y="157" fill="#253b54" font-size="18">Sous-systèmes (Win32, WSL), lsass.exe</text>
    </g>

    <g>
      <path d="M26 181H194M446 181H614" fill="none" stroke="#7d93ad" stroke-width="1.5" stroke-dasharray="5 5"/>
      <text x="320" y="187" text-anchor="middle" fill="#3e5470" font-size="17">Frontière de privilèges</text>
    </g>

    <g>
      <rect x="17" y="197" width="606" height="77" rx="12" fill="#ffffff" stroke="#9ccac8"/>
      <rect x="28" y="214" width="43" height="43" rx="10" fill="#ddf4f0"/>
      <g fill="none" stroke="#12645e" stroke-width="2" stroke-linecap="round">
        <rect x="42" y="228" width="15" height="15" rx="2"/>
        <rect x="47" y="233" width="5" height="5" rx="1"/>
        <path d="M46 228v-4m7 4v-4m-7 19v4m7-4v4m-11-15h-4m4 7h-4m19-7h4m-4 7h4"/>
      </g>
      <text x="85" y="223" fill="#104c49" font-size="22" font-weight="700">Mode noyau</text>
      <text x="85" y="245" fill="#253b54" font-size="18">ntoskrnl.exe (exécutif et noyau), pilotes</text>
      <text x="85" y="265" fill="#253b54" font-size="18">HAL, système de fichiers (NTFS / ReFS)</text>
    </g>

    <g>
      <rect x="17" y="287" width="606" height="77" rx="12" fill="#f2ecff" stroke="#c1afe8" stroke-dasharray="5 3"/>
      <rect x="28" y="304" width="43" height="43" rx="10" fill="#e7dbfb"/>
      <g fill="none" stroke="#633b9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M49.5 314c3 2.5 6.5 3.5 10 4.5v6c0 6.5-4 10.5-10 13-6-2.5-10-6.5-10-13v-6c3.5-1 7-2 10-4.5Z"/>
        <path d="m45 325 3 3 6-6"/>
      </g>
      <text x="85" y="313" fill="#4d2b79" font-size="22" font-weight="700">VBS</text>
      <text x="85" y="335" fill="#392b51" font-size="18">Sécurité basée sur la virtualisation, si activée</text>
      <text x="85" y="355" fill="#392b51" font-size="18">Credential Guard, intégrité mémoire (HVCI)</text>
      <rect x="514" y="295" width="98" height="26" rx="13" fill="#e7dbfb"/>
      <text x="563" y="313" text-anchor="middle" fill="#4d2b79" font-size="16" font-weight="700">Chap. 09</text>
    </g>

    <g>
      <rect x="17" y="377" width="606" height="57" rx="12" fill="#fff7e8" stroke="#dac08d"/>
      <rect x="28" y="384" width="43" height="43" rx="10" fill="#f8e7c4"/>
      <g fill="none" stroke="#86510a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M49.5 395v10m-6-8a10 10 0 1 0 12 0"/>
      </g>
      <text x="85" y="401" fill="#63400e" font-size="22" font-weight="700">Firmware et démarrage</text>
      <text x="85" y="423" fill="#4d3c23" font-size="18">UEFI, Secure Boot et TPM 2.0</text>
      <rect x="514" y="385" width="98" height="26" rx="13" fill="#f8e7c4"/>
      <text x="563" y="403" text-anchor="middle" fill="#63400e" font-size="16" font-weight="700">Chap. 02</text>
    </g>
  </g>
</svg>
