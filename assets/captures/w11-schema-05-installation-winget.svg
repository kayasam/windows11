<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" role="img" aria-labelledby="title desc">
  <title id="title">Installation avec WinGet</title>
  <desc id="desc">Pour installer 7-Zip, WinGet lit le manifeste, télécharge et vérifie l’installeur, puis l’exécute silencieusement.</desc>
  <rect x="1" y="1" width="638" height="446" rx="20" fill="#f1f5fa" stroke="#a9bad0"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M21 2H619Q638 2 638 21V72H2V21Q2 2 21 2Z" fill="#14243d"/>
<path d="M4 8h16m-4-4 4 4-4 4 M14 17h16m-4-4 4 4-4 4 M4 26h16m-4-4 4 4-4 4" transform="translate(24 20)" fill="none" stroke="#7ed5ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="46" fill="#ffffff" font-size="26" font-weight="700">Installation avec WinGet</text>
    <rect x="17" y="87" width="606" height="84" rx="10" fill="#ffffff" stroke="#a6c9ed"/>
    <rect x="31" y="96" width="25" height="25" rx="8" fill="#e2efff" stroke="none"/>
    <text x="43.5" y="114" fill="#143c6f" font-size="15" font-weight="700" text-anchor="middle">1</text>
    <text x="65" y="114" fill="#143c6f" font-size="21" font-weight="700">winget install 7zip.7zip</text>
    <text x="65" y="135" fill="#253b54" font-size="18">WinGet consulte la source winget, issue du dépôt</text>
    <text x="65" y="156" fill="#253b54" font-size="18">microsoft/winget-pkgs géré par Microsoft.</text>
    <path d="M320.0 172L320.0 186" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320.0,186 316.0,180 324.0,180" fill="#6e85a0"/>
    <rect x="17" y="188" width="606" height="84" rx="10" fill="#ffffff" stroke="#a6c9ed"/>
    <rect x="31" y="197" width="25" height="25" rx="8" fill="#e2efff" stroke="none"/>
    <text x="43.5" y="215" fill="#143c6f" font-size="15" font-weight="700" text-anchor="middle">2</text>
    <text x="65" y="215" fill="#143c6f" font-size="21" font-weight="700">Lire le manifeste</text>
    <text x="65" y="236" fill="#253b54" font-size="18">https://github.com/ip7z/.../7z2606-x64.exe</text>
    <text x="65" y="257" fill="#253b54" font-size="18">Empreinte SHA256 attendue.</text>
    <path d="M320.0 273L320.0 287" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320.0,287 316.0,281 324.0,281" fill="#6e85a0"/>
    <rect x="17" y="289" width="606" height="63" rx="10" fill="#ffffff" stroke="#9ccac8"/>
    <rect x="31" y="298" width="25" height="25" rx="8" fill="#ddf4f0" stroke="none"/>
    <text x="43.5" y="316" fill="#104c49" font-size="15" font-weight="700" text-anchor="middle">3</text>
    <text x="65" y="316" fill="#104c49" font-size="21" font-weight="700">Télécharger et vérifier</text>
    <text x="65" y="337" fill="#253b54" font-size="18">WinGet vérifie l’empreinte du fichier téléchargé.</text>
    <path d="M320.0 353L320.0 367" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="320.0,367 316.0,361 324.0,361" fill="#6e85a0"/>
    <rect x="17" y="369" width="606" height="63" rx="10" fill="#ffffff" stroke="#c1afe8"/>
    <rect x="31" y="378" width="25" height="25" rx="8" fill="#f2ecff" stroke="none"/>
    <text x="43.5" y="396" fill="#4d2b79" font-size="15" font-weight="700" text-anchor="middle">4</text>
    <text x="65" y="396" fill="#4d2b79" font-size="21" font-weight="700">Installer</text>
    <text x="65" y="417" fill="#253b54" font-size="18">L’installeur est lancé en mode silencieux.</text>
  </g>
</svg>
