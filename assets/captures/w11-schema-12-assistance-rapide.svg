<text x="72" y="46" fill="#ffffff" font-size="26" font-weight="700">Une session d’Assistance rapide</text>
    <rect x="17" y="87" width="298" height="59" rx="10" fill="#e2efff" stroke="#a6c9ed"/>
    <text x="29" y="110" fill="#143c6f" font-size="17" font-weight="700">Utilisateur A</text>
    <text x="29" y="129" fill="#253b54" font-size="16">Donne de l’assistance.</text>
    <rect x="325" y="87" width="298" height="59" rx="10" fill="#ddf4f0" stroke="#9ccac8"/>
    <text x="337" y="110" fill="#104c49" font-size="17" font-weight="700">Utilisateur B</text>
    <text x="337" y="129" fill="#253b54" font-size="16">Reçoit de l’assistance.</text>
    <path d="M166.0 146L166.0 167" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="166.0,167 162.0,161 170.0,161" fill="#6e85a0"/>
    <path d="M474.0 146L474.0 167" fill="none" stroke="#6e85a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="474.0,167 470.0,161 478.0,161" fill="#6e85a0"/>
    <rect x="17" y="168" width="298" height="59" rx="10" fill="#ffffff" stroke="#a6c9ed"/>
    <text x="29" y="191" fill="#143c6f" font-size="17" font-weight="700">Donner de l’assistance</text>
    <text x="29" y="210" fill="#253b54" font-size="16">Générer le code à 6 chiffres.</text>
    <rect x="325" y="168" width="298" height="59" rx="10" fill="#ffffff" stroke="#9ccac8"/>
    <text x="337" y="191" fill="#104c49" font-size="17" font-weight="700">Obtenir de l’assistance</text>
    <text x="337" y="210" fill="#253b54" font-size="16">Saisir le code reçu.</text>
