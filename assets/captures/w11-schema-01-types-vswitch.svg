<svg xmlns="http://www.w3.org/2000/svg" width="640" height="416" viewBox="0 0 640 416" role="img" aria-labelledby="title desc">
  <title id="title">Les trois types de vSwitch</title>
  <desc id="desc">Le switch externe relie les VM au réseau physique, l’interne les relie à l’hôte et le privé relie seulement les VM.</desc>
